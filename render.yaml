services:
  - type: web
    name: voicecart-ai-web
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run render:start
    healthCheckPath: /api/webhook
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ECOMMERCE_ONLY
        value: "true"
      - key: ECOMMERCE_LANGUAGE
        value: en
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: gpt-4o-mini-transcribe
      - key: ULTRAMSG_INSTANCE_ID
        value: instance177604
      - key: ULTRAMSG_BASE_URL
        value: https://api.ultramsg.com/instance177604
      - key: ULTRAMSG_TOKEN
        sync: false
      - key: WHATSAPP_SAFE_MODE
        value: "true"
      - key: WHATSAPP_AUDIO_REPLIES
        value: "true"
      - key: WHATSAPP_SEND_TEXT_WITH_AUDIO
        value: "false"
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_MODEL_ID
        value: eleven_multilingual_v2
      - key: ELEVENLABS_OUTPUT_FORMAT
        value: mp3_44100_128
      - key: ELEVENLABS_LANGUAGE_CODE
        value: en
      - key: PAYMENT_INSTRUCTIONS
        sync: false
      - key: PRODUCTS_JSON_PATH
        value: productos.json
